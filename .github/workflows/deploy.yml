# 사이트 올리기: web 폴더가 바뀌면 GitHub 가 빌드해서 Cloudflare Pages 에 올려요.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN (Cloudflare Pages 편집 권한이 있는 토큰)
name: 사이트 올리기

on:
  push:
    branches: [main, claude/sharp-goodall-u9aey8]
    paths:
      - "web/**"
      - "supabase/functions/_shared/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 의존성 설치
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: 빌드
        working-directory: web
        run: npm run build
      - name: Cloudflare Pages 에 올리기
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 17bcf986e4a6df06382d909f64ed7828
        run: npx --yes wrangler@4 pages deploy dist --project-name dawoong-gomin --branch main
